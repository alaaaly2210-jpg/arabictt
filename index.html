    <style>
        * {
            box-sizing: border-box;
        }

        html {
            font-family: 'Amiri', serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #BAE6FD 0%,
                    #FFFFFF 48%,
                    #CCFBF1 100%
                );
            background-attachment: fixed;
            color: #0f172a;
        }

        .dark body {
            background:
                linear-gradient(
                    135deg,
                    #030712 0%,
                    #0F172A 48%,
                    #042F2E 100%
                );
            color: #f8fafc;
        }

        .glass {
            background: rgba(255,255,255,.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.65);
            box-shadow: 0 12px 35px rgba(15,23,42,.08);
        }

        .dark .glass {
            background: rgba(15,23,42,.68);
            border-color: rgba(255,255,255,.08);
            box-shadow: 0 12px 35px rgba(0,0,0,.25);
        }

        .glass-strong {
            background: rgba(255,255,255,.84);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.75);
        }

        .dark .glass-strong {
            background: rgba(15,23,42,.84);
            border-color: rgba(255,255,255,.08);
        }

        .hover-card {
            transition: all .25s ease;
        }

        .hover-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 40px rgba(15,23,42,.13);
        }

        .dark .hover-card:hover {
            box-shadow: 0 18px 40px rgba(0,0,0,.32);
        }

        .gradient-text {
            background: linear-gradient(90deg, #0D9488, #0284C7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .progress-track {
            height: 8px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .dark .progress-track {
            background: #1e293b;
        }

        .progress-bar {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #0D9488, #0284C7);
        }

        .fade-in {
            animation: fadeIn .35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast {
            animation: toastIn .3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lesson-number {
            min-width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0D9488, #0284C7);
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .subject-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(13,148,136,.12), rgba(2,132,199,.12));
            color: #0D9488;
        }

        .dark .subject-icon {
            background: linear-gradient(135deg, rgba(13,148,136,.18), rgba(2,132,199,.18));
        }

        button {
            font-family: inherit;
        }
    </style>

                        </div>

                        <div class="text-xl font-bold mt-2">
                            ${subject.progress >= 75 ? 'متقدم' : subject.progress >= 40 ? 'متوسط' : 'بداية الطريق'}
                        </div>

                    </div>

                </div>

            </div>


            <div class="flex items-end justify-between gap-4 mb-6">

                <div>

                    <span class="text-tier-accent font-bold">
                        محتوى المادة
                    </span>

                    <h2 class="text-3xl font-bold mt-1">
                        الدروس
                    </h2>

                </div>

                <span class="text-sm text-slate-500 dark:text-slate-400">
                    ${displayedLessons.length} دروس متاحة حاليًا
                </span>

            </div>


            <div class="space-y-4">

                ${displayedLessons.map((lesson, index) => `

                    <div class="glass hover-card rounded-3xl p-5 sm:p-6">

                        <div class="flex flex-col sm:flex-row sm:items-center gap-5">

                            <div class="lesson-number">
                                ${index + 1}
                            </div>

                            <div class="flex-1">

                                <div class="flex flex-wrap items-center gap-3">

                                    <h3 class="text-xl font-bold">
                                        ${lesson.title}
                                    </h3>

                                    <span class="text-xs px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                                        <i class="fa-regular fa-clock ml-1"></i>
                                        ${lesson.duration}
                                    </span>

                                </div>

                                <p class="text-sm leading-7 text-slate-500 dark:text-slate-400 mt-2">
                                    ${lesson.desc}
                                </p>

                            </div>

                            <button
                                onclick="PlatformApp.navigate('lesson', {
                                    section: '${section.id}',
                                    stage: '${activeStage.id}',
                                    grade: '${activeGrade.id}',
                                    subject: '${subject.id}',
                                    lesson: '${lesson.id}'
                                })"
                                class="px-5 py-3 rounded-xl bg-tier-accent text-white hover:bg-tier-accentHover transition shrink-0">

                                <i class="fa-solid fa-play ml-2"></i>

                                ابدأ الدرس

                            </button>

                        </div>

                    </div>

                `).join('')}

            </div>

        </section>
        `;
    },


    templateLessonView() {

        const section =
            AppData.sections.find(s => s.id === this.state.selectedSectionId)
            || AppData.sections[0];

        const activeStage =
            AppData.stages.find(s => s.id === this.state.selectedStageId)
            || AppData.stages[2];

        const activeGrade =
            activeStage.grades.find(g => g.id === this.state.selectedGradeId)
            || activeStage.grades[activeStage.grades.length - 1];

        const subject =
            AppData.subjects.find(
                s => s.id === this.state.selectedSubjectId
            )
            || AppData.subjects[0];

        const lessons =
            AppData.lessons[subject.id]
            || [];

        const lesson =
            lessons.find(
                l => l.id === this.state.selectedLessonId
            )
            || lessons[0]
            || {
                id: 'default',
                title: 'الدرس',
                duration: '30 دقيقة',
                desc: 'سيتم إضافة محتوى هذا الدرس قريبًا.'
            };

        return `

        <section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

            ${this.templateBreadcrumb([
                section.title,
                activeStage.title,
                activeGrade.title,
                subject.title,
                lesson.title
            ])}


            <div class="glass rounded-[2rem] overflow-hidden">

                <div class="bg-gradient-to-br from-tier-accent to-tier-skyAccent p-8 sm:p-12 text-white">

                    <div class="flex items-center gap-3 text-white/80 text-sm mb-5">

                        <i class="fa-solid ${subject.icon}"></i>

                        <span>
                            ${subject.title}
                        </span>

                        <i class="fa-solid fa-chevron-left text-xs"></i>

                        <span>
                            الدرس
                        </span>

                    </div>

                    <h1 class="text-3xl sm:text-5xl font-bold">
                        ${lesson.title}
                    </h1>

                    <p class="mt-5 text-lg text-white/85 leading-9">
                        ${lesson.desc}
                    </p>

                </div>


                <div class="p-6 sm:p-10">

                    <div class="grid sm:grid-cols-2 gap-4 mb-8">

                        <div class="glass rounded-2xl p-5">

                            <div class="text-sm text-slate-500 dark:text-slate-400">
                                الصف
                            </div>

                            <div class="font-bold text-lg mt-1">
                                ${activeGrade.title}
                            </div>

                        </div>

                        <div class="glass rounded-2xl p-5">

                            <div class="text-sm text-slate-500 dark:text-slate-400">
                                مدة الدرس
                            </div>

                            <div class="font-bold text-lg mt-1">
                                ${lesson.duration}
                            </div>

                        </div>

                    </div>


                    <div class="rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 p-8 sm:p-12 text-center">

                        <div class="w-20 h-20 rounded-3xl bg-teal-50 dark:bg-teal-900/20 text-tier-accent flex items-center justify-center mx-auto mb-6">

                            <i class="fa-solid fa-book-open text-3xl"></i>

                        </div>

                        <h2 class="text-2xl font-bold">
                            محتوى الدرس
                        </h2>

                        <p class="mt-4 text-slate-500 dark:text-slate-400 leading-8 max-w-2xl mx-auto">
                            هذه هي صفحة الدرس الفعلية.
                            في الخطوة القادمة يمكننا إضافة شرح الدرس،
                            الفيديو، الأمثلة، التدريبات، والأسئلة التفاعلية
                            داخل هذه الصفحة.
                        </p>

                        <div class="mt-8 flex flex-wrap justify-center gap-3">

                            <button
                                onclick="PlatformApp.showToast('سيتم إضافة الفيديو التعليمي في المرحلة القادمة')"
                                class="px-6 py-3 rounded-xl bg-tier-accent text-white hover:bg-tier-accentHover transition">

                                <i class="fa-solid fa-play ml-2"></i>
                                تشغيل الفيديو

                            </button>

                            <button
                                onclick="PlatformApp.showToast('سيتم إضافة التدريبات التفاعلية في المرحلة القادمة')"
                                class="px-6 py-3 rounded-xl glass hover:text-tier-accent transition">

                                <i class="fa-solid fa-pen-to-square ml-2"></i>
                                تدريبات الدرس

                            </button>

                        </div>

                    </div>


                    <div class="mt-8 flex flex-col sm:flex-row justify-between gap-3">

                        <button
                            onclick="PlatformApp.navigate('subject', {
                                section: '${section.id}',
                                stage: '${activeStage.id}',
                                grade: '${activeGrade.id}',
                                subject: '${subject.id}'
                            })"
                            class="px-5 py-3 rounded-xl glass hover:text-tier-accent transition">

                            <i class="fa-solid fa-arrow-right ml-2"></i>
                            العودة إلى دروس المادة

                        </button>

                        <button
                            onclick="PlatformApp.navigate('subjects', {
                                section: '${section.id}',
                                stage: '${activeStage.id}',
                                grade: '${activeGrade.id}'
                            })"
                            class="px-5 py-3 rounded-xl glass hover:text-tier-accent transition">

                            جميع المواد
                            <i class="fa-solid fa-arrow-left mr-2"></i>

                        </button>

                    </div>

                </div>

            </div>

        </section>
        `;
    },


    templatePlaceholder(title, description) {

        return `

        <section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-20">

            <div class="glass rounded-[2rem] p-10 sm:p-16 text-center">

                <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-teal-100 to-sky-100 dark:from-teal-900/30 dark:to-sky-900/30 text-tier-accent flex items-center justify-center mx-auto">

                    <i class="fa-solid fa-screwdriver-wrench text-3xl"></i>

                </div>

                <h1 class="text-4xl font-bold mt-7">
                    ${title}
                </h1>

                <p class="text-lg text-slate-500 dark:text-slate-400 mt-4">
                    ${description}
                </p>

                <div class="mt-7 inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-teal-50 dark:bg-teal-900/20 text-tier-accent font-bold">

                    <i class="fa-solid fa-circle-info"></i>

                    هذه الواجهة مجهزة وجاهزة لبناء المحتوى.

                </div>

                <div class="mt-8">

                    <button
                        onclick="PlatformApp.navigate('home')"
                        class="px-6 py-3 rounded-xl bg-tier-accent text-white hover:bg-tier-accentHover transition">

                        <i class="fa-solid fa-house ml-2"></i>

                        العودة للرئيسية

                    </button>

                </div>

            </div>

        </section>
        `;
    },


    toggleDarkMode() {

        document.documentElement.classList.toggle('dark');

        const isDark =
            document.documentElement.classList.contains('dark');

        localStorage.setItem('arabic-platform-dark', isDark ? '1' : '0');

        this.updateThemeIcon();
    },


    loadTheme() {

        const saved =
            localStorage.getItem('arabic-platform-dark');

        if (saved === '1') {
            document.documentElement.classList.add('dark');
        }

        this.updateThemeIcon();
    },


    updateThemeIcon() {

        const icon =
            document.getElementById('theme-icon');

        if (!icon) return;

        const isDark =
            document.documentElement.classList.contains('dark');

        icon.className =
            isDark
            ? 'fa-solid fa-sun'
            : 'fa-solid fa-moon';
    },


    toggleMobileMenu() {

        const menu =
            document.getElementById('mobile-menu');

        if (!menu) return;

        menu.classList.toggle('hidden');
    },


    login() {

        this.showToast(
            'تسجيل الدخول سيتم تفعيله في المرحلة القادمة.',
            'info'
        );
    },


    showToast(message, type = 'success') {

        const container =
            document.getElementById('toast-container');

        const toast =
            document.createElement('div');

        const icon =
            type === 'info'
            ? 'fa-circle-info'
            : 'fa-circle-check';

        toast.className =
            'toast glass rounded-2xl px-5 py-4 min-w-[280px] max-w-[360px] flex items-center gap-3 shadow-xl';

        toast.innerHTML = `

            <div class="w-9 h-9 rounded-xl bg-teal-50 dark:bg-teal-900/20 text-tier-accent flex items-center justify-center shrink-0">
                <i class="fa-solid ${icon}"></i>
            </div>

            <div class="text-sm leading-6">
                ${message}
            </div>

        `;

        container.appendChild(toast);

        setTimeout(() => {

            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            toast.style.transition = '.3s ease';

            setTimeout(() => toast.remove(), 300);

        }, 3000);
    }
};


document.addEventListener('DOMContentLoaded', () => {

    PlatformApp.init();

});


</script>

</body>
</html>
