            border-color: rgba(255,255,255,.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.75);
        }

        .dark .glass-strong {
            background: rgba(15,23,42,.84);
            border-color: rgba(255,255,255,.08);
        }

            transition: all .25s ease;
        }

        .hover-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 40px rgba(15,23,42,.13);
        }

        .dark .hover-card:hover {
            box-shadow: 0 18px 40px rgba(0,0,0,.32);
        }

        .gradient-text {
            background: linear-gradient(90deg, #0D9488, #0284C7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .progress-track {
            height: 8px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .dark .progress-track {
            background: #1e293b;
        }

        .progress-bar {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #0D9488, #0284C7);
        }

        .fade-in {
            animation: fadeIn .35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast {
            animation: toastIn .3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            this.state.selectedLessonId = params.lesson;

                                </div>
                            </div>

                            <div class="space-y-6" id="exercises-container">
                                ${lesson.exercises.map((ex, exIndex) => `
                                    <div class="glass rounded-3xl p-6 sm:p-8 exercise-card" data-ex-id="${ex.id}" data-correct="${ex.correctIndex}">
                                        <div class="font-bold text-lg mb-4">
                                            السؤال ${exIndex + 1}: ${ex.question}
                                        </div>
                                        <div class="space-y-3 mb-4">
                                            ${ex.options.map((opt, optIndex) => `
                                                <button
                                                    onclick="PlatformApp.checkAnswer(this, ${exIndex}, ${optIndex}, ${ex.correctIndex})"
                                                    class="w-full text-right p-4 rounded-2xl glass hover:bg-teal-50 dark:hover:bg-teal-900/20 transition flex items-center justify-between option-btn border border-white/50 dark:border-white/10">
                                                    <span>${opt}</span>
                                                    <span class="w-6 h-6 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center text-xs opt-indicator"></span>
                                                </button>
                                            `).join('')}
                                        </div>
                                        <div class="feedback-box hidden mt-4 p-4 rounded-2xl text-sm leading-7"></div>
                                    </div>
                                `).join('')}
                            </div>

                            <div id="quiz-result-banner" class="hidden mt-6 p-6 rounded-2xl text-center glass border border-teal-200 dark:border-teal-800">
                                <h3 class="text-xl font-bold text-tier-accent mb-2">نتيجة التدريب</h3>
                                <p id="quiz-result-text" class="text-lg font-bold mb-4"></p>
                                <button
                                    onclick="PlatformApp.resetExercises()"
                                    class="px-5 py-2.5 rounded-xl bg-tier-accent text-white text-sm font-bold hover:bg-tier-accentHover transition">
                                    <i class="fa-solid fa-rotate-right ml-1"></i> إعادة المحاولة
                                </button>
                            </div>
                        </div>
                    ` : ''}


                    <!-- Bottom Navigation Buttons -->
                    <div class="pt-8 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">

                        <button
                            onclick="PlatformApp.navigate('subject', {
                                section: '${section.id}',
                                stage: '${activeStage.id}',
                                grade: '${activeGrade.id}',
                                subject: '${subject.id}'
                            })"
                            class="w-full sm:w-auto px-6 py-3 rounded-xl glass hover:text-tier-accent transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-list-ul"></i>
                            العودة إلى قائمة دروس المادة
                        </button>

                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            ${lesson.prevLessonId ? `
                                <button
                                    onclick="PlatformApp.navigate('lesson', {
                                        section: '${section.id}',
                                        stage: '${activeStage.id}',
                                        grade: '${activeGrade.id}',
                                        subject: '${subject.id}',
                                        lesson: '${lesson.prevLessonId}'
                                    })"
                                    class="flex-1 sm:flex-initial px-5 py-3 rounded-xl glass hover:text-tier-accent transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-arrow-right"></i>
                                    الدرس السابق
                                </button>
                            ` : ''}

                            ${lesson.nextLessonId ? `
                                <button
                                    onclick="PlatformApp.navigate('lesson', {
                                        section: '${section.id}',
                                        stage: '${activeStage.id}',
                                        grade: '${activeGrade.id}',
                                        subject: '${subject.id}',
                                        lesson: '${lesson.nextLessonId}'
                                    })"
                                    class="flex-1 sm:flex-initial px-5 py-3 rounded-xl bg-tier-accent text-white hover:bg-tier-accentHover transition flex items-center justify-center gap-2">
                                    الدرس التالي
                                    <i class="fa-solid fa-arrow-left"></i>
                                </button>
                            ` : ''}
                        </div>

                    </div>

                </div>

            </div>

        </section>
        `;
    },


    checkAnswer(btn, exerciseIndex, selectedOptIndex, correctOptIndex) {
        const card = btn.closest('.exercise-card');
        const buttons = card.querySelectorAll('.option-btn');
        const feedbackBox = card.querySelector('.feedback-box');

        buttons.forEach((b, idx) => {
            b.disabled = true;
            b.classList.add('opacity-80', 'cursor-not-allowed');
            if (idx === correctOptIndex) {
                b.classList.add('bg-teal-100', 'dark:bg-teal-900/40', 'border-teal-500');
                b.querySelector('.opt-indicator').innerHTML = '<i class="fa-solid fa-check text-tier-accent"></i>';
            } else if (idx === selectedOptIndex && selectedOptIndex !== correctOptIndex) {
                b.classList.add('bg-rose-100', 'dark:bg-rose-900/40', 'border-rose-500');
                b.querySelector('.opt-indicator').innerHTML = '<i class="fa-solid fa-xmark text-rose-500"></i>';
            }
        });

        feedbackBox.classList.remove('hidden');
        if (selectedOptIndex === correctOptIndex) {
            feedbackBox.className = 'feedback-box mt-4 p-4 rounded-2xl text-sm leading-7 bg-teal-50 dark:bg-teal-950/30 text-teal-700 dark:text-teal-300 border border-teal-200 dark:border-teal-800';
            feedbackBox.innerHTML = '<i class="fa-solid fa-circle-check ml-1"></i> إجابة صحيحة! أحسنت.';
            card.setAttribute('data-answered', 'correct');
        } else {
            feedbackBox.className = 'feedback-box mt-4 p-4 rounded-2xl text-sm leading-7 bg-rose-50 dark:bg-rose-950/30 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800';
            feedbackBox.innerHTML = `<i class="fa-solid fa-circle-xmark ml-1"></i> إجابة غير صائبة. الإجابة الصحيحة هي الخيار المحدد بالأخضر.`;
            card.setAttribute('data-answered', 'incorrect');
        }

        this.checkAllExercisesCompleted();
    },

    checkAllExercisesCompleted() {
        const cards = document.querySelectorAll('.exercise-card');
        if (cards.length === 0) return;

        let answeredCount = 0;
        let correctCount = 0;

        cards.forEach(card => {
            const status = card.getAttribute('data-answered');
            if (status) {
                answeredCount++;
                if (status === 'correct') {
                    correctCount++;
                }
            }
        });

        if (answeredCount === cards.length) {
            const resultBanner = document.getElementById('quiz-result-banner');
            const resultText = document.getElementById('quiz-result-text');
            if (resultBanner && resultText) {
                resultBanner.classList.remove('hidden');
                resultText.innerHTML = `لقد أجبت بشكل صحيح على <strong>${correctCount}</strong> من أصل <strong>${cards.length}</strong> أسئلة.`;

                if (correctCount >= Math.ceil(cards.length / 2)) {
                    this.markCurrentLessonCompleted();
                }
            }
        }
    },

    resetExercises() {
        this.render();
    },

    markCurrentLessonCompleted() {
        const subjectId = this.state.selectedSubjectId;
        const lessonId = this.state.selectedLessonId;
        if (!subjectId || !lessonId) return;

        let progressData = JSON.parse(localStorage.getItem('arabic_platform_progress') || '{}');
        if (!progressData[subjectId]) {
            progressData[subjectId] = [];
        }
        if (!progressData[subjectId].includes(lessonId)) {
            progressData[subjectId].push(lessonId);
            localStorage.setItem('arabic_platform_progress', JSON.stringify(progressData));

            const badgeContainer = document.getElementById('lesson-status-badge');
            if (badgeContainer) {
                badgeContainer.innerHTML = `
                    <span class="px-4 py-1.5 rounded-full bg-white/20 text-white text-xs font-bold backdrop-blur-md">
                        <i class="fa-solid fa-check ml-1"></i> مكتمل
                    </span>
                `;
            }
            this.showToast('أحسنت! تم حفظ إنجازك لهذا الدرس.');
        }
    },

    isLessonCompleted(subjectId, lessonId) {
        let progressData = JSON.parse(localStorage.getItem('arabic_platform_progress') || '{}');
        return progressData[subjectId] && progressData[subjectId].includes(lessonId);
    },


    templatePlaceholder(title, description) {

        return `

        <section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-20">

            <div class="glass rounded-[2rem] p-10 sm:p-16 text-center">

                <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-teal-100 to-sky-100 dark:from-teal-900/30 dark:to-sky-900/30 text-tier-accent flex items-center justify-center mx-auto">

                    <i class="fa-solid fa-screwdriver-wrench text-3xl"></i>

                </div>

                <h1 class="text-4xl font-bold mt-7">
                    ${title}
                </h1>

                <p class="text-lg text-slate-500 dark:text-slate-400 mt-4">
                    ${description}
                </p>

                <div class="mt-7 inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-teal-50 dark:bg-teal-900/20 text-tier-accent font-bold">

                    <i class="fa-solid fa-circle-info"></i>

                    هذه الواجهة مجهزة وجاهزة لبناء المحتوى.

                </div>

                <div class="mt-8">

                    <button
                        onclick="PlatformApp.navigate('home')"
                        class="px-6 py-3 rounded-xl bg-tier-accent text-white hover:bg-tier-accentHover transition">

                        <i class="fa-solid fa-house ml-2"></i>

                        العودة للرئيسية

                    </button>

                </div>

            </div>

        </section>
        `;
    },


    toggleDarkMode() {

        document.documentElement.classList.toggle('dark');

        const isDark =
            document.documentElement.classList.contains('dark');

        localStorage.setItem('arabic-platform-dark', isDark ? '1' : '0');

        this.updateThemeIcon();
    },


    loadTheme() {

        const saved =
            localStorage.getItem('arabic-platform-dark');

        if (saved === '1') {
            document.documentElement.classList.add('dark');
        }

        this.updateThemeIcon();
    },


    updateThemeIcon() {

        const icon =
            document.getElementById('theme-icon');

        if (!icon) return;

        const isDark =
            document.documentElement.classList.contains('dark');

        icon.className =
            isDark
            ? 'fa-solid fa-sun'
            : 'fa-solid fa-moon';
    },


    toggleMobileMenu() {

        const menu =
            document.getElementById('mobile-menu');

        if (!menu) return;

        menu.classList.toggle('hidden');
    },


    login() {

        this.showToast(
            'تسجيل الدخول سيتم تفعيله في المرحلة القادمة.',
            'info'
        );
    },


    showToast(message, type = 'success') {

        const container =
            document.getElementById('toast-container');

        const toast =
            document.createElement('div');

        const icon =
            type === 'info'
            ? 'fa-circle-info'
            : 'fa-circle-check';

        toast.className =
            'toast glass rounded-2xl px-5 py-4 min-w-[280px] max-w-[360px] flex items-center gap-3 shadow-xl';

        toast.innerHTML = `

            <div class="w-9 h-9 rounded-xl bg-teal-50 dark:bg-teal-900/20 text-tier-accent flex items-center justify-center shrink-0">
                <i class="fa-solid ${icon}"></i>
            </div>

            <div class="text-sm leading-6">
                ${message}
            </div>

        `;

        container.appendChild(toast);

        setTimeout(() => {

            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            toast.style.transition = '.3s ease';

            setTimeout(() => toast.remove(), 300);

        }, 3000);
    }
};


document.addEventListener('DOMContentLoaded', () => {

    PlatformApp.init();

});

</script>

</body>
</html>
